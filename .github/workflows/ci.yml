name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ca_cert_sha256:
        description: Verified SHA-256 for https://curl.se/ca/cacert.pem
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build manager
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache: false

      - name: Check shell scripts
        run: |
          bash -n module/service.sh
          bash -n module/scripts/common.sh
          bash -n module/scripts/control.sh
          bash -n module/scripts/supervisor.sh
          bash -n module/scripts/webui-bridge.sh

      - name: Test manager
        working-directory: manager
        run: |
          go vet ./...
          go test ./...

      - name: Build Android ARM64 manager
        working-directory: manager
        run: |
          mkdir -p ../module/manager
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../module/manager/android-mini-server-manager .
          test -s ../module/manager/android-mini-server-manager

      - name: Create non-flashable validation package
        run: |
          mkdir -p artifacts/ci-package
          (
            cd manager
            go list -m -json all
          ) > artifacts/ci-package/go-module-inventory.json
          cat > artifacts/ci-package/sbom.spdx.json <<EOF
          {"SPDXID":"SPDXRef-DOCUMENT","spdxVersion":"SPDX-2.3","creationInfo":{"creators":["Tool: GitHub Actions"],"created":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"},"dataLicense":"CC0-1.0","documentNamespace":"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","name":"xray-server-native-${GITHUB_SHA}","packages":[{"SPDXID":"SPDXRef-Package","name":"xray-server-native-manager","versionInfo":"${GITHUB_SHA}","downloadLocation":"NOASSERTION","filesAnalyzed":false,"licenseConcluded":"GPL-3.0-or-later","licenseDeclared":"GPL-3.0-or-later"}],"relationships":[{"spdxElementId":"SPDXRef-DOCUMENT","relationshipType":"DESCRIBES","relatedSpdxElement":"SPDXRef-Package"}]}
          EOF
          zip -qr artifacts/ci-package/xray-server-native-ci.zip module LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_SOURCES.md LICENSES

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xray-server-native-${{ github.sha }}
          path: artifacts/ci-package/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build flashable module ZIP
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ca_cert_sha256 != '' }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache: false

      - name: Validate CA checksum input
        shell: pwsh
        run: |
          if ('${{ inputs.ca_cert_sha256 }}' -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'ca_cert_sha256 must be a SHA-256 digest.'
          }

      - name: Download and verify upstream payloads
        shell: pwsh
        run: .\tools\prepare-upstream-binaries.ps1 -CaCertSha256 '${{ inputs.ca_cert_sha256 }}'

      - name: Build Android ARM64 manager
        shell: pwsh
        run: .\tools\build-manager.ps1

      - name: Build flashable ZIP
        shell: pwsh
        run: .\tools\package-module.ps1 -OutputDirectory artifacts\release

      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: ifyUI-module-${{ github.sha }}
          path: artifacts/release/*.zip
          if-no-files-found: error
          retention-days: 14
