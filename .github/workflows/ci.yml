name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Module version used in the ZIP filename
        required: true
        default: 1.0.0
        type: string
      package_type:
        description: Package channel; release also publishes a GitHub Release
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      ca_cert_sha256:
        description: Verified SHA-256 for https://curl.se/ca/cacert.pem
        required: true
        default: f66dff1bdf8f96060b8177976f8b7d9254bc89bc4db933d769f7384d28480bc9
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build manager
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache: false

      - name: Check shell scripts
        run: |
          bash -n module/service.sh
          bash -n module/scripts/common.sh
          bash -n module/scripts/control.sh
          bash -n module/scripts/supervisor.sh
          bash -n module/scripts/webui-bridge.sh

      - name: Test manager
        working-directory: manager
        run: |
          go vet ./...
          go test ./...

      - name: Build Android ARM64 manager
        working-directory: manager
        run: |
          mkdir -p ../module/manager
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../module/manager/android-mini-server-manager .
          test -s ../module/manager/android-mini-server-manager

      - name: Create non-flashable validation package
        run: |
          mkdir -p artifacts/ci-package
          (
            cd manager
            go list -m -json all
          ) > artifacts/ci-package/go-module-inventory.json
          cat > artifacts/ci-package/sbom.spdx.json <<EOF
          {"SPDXID":"SPDXRef-DOCUMENT","spdxVersion":"SPDX-2.3","creationInfo":{"creators":["Tool: GitHub Actions"],"created":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"},"dataLicense":"CC0-1.0","documentNamespace":"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","name":"xray-server-native-${GITHUB_SHA}","packages":[{"SPDXID":"SPDXRef-Package","name":"xray-server-native-manager","versionInfo":"${GITHUB_SHA}","downloadLocation":"NOASSERTION","filesAnalyzed":false,"licenseConcluded":"GPL-3.0-or-later","licenseDeclared":"GPL-3.0-or-later"}],"relationships":[{"spdxElementId":"SPDXRef-DOCUMENT","relationshipType":"DESCRIBES","relatedSpdxElement":"SPDXRef-Package"}]}
          EOF
          zip -qr artifacts/ci-package/xray-server-native-ci.zip module LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_SOURCES.md LICENSES

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xray-server-native-${{ github.sha }}
          path: artifacts/ci-package/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Build flashable module ZIP
    if: ${{ inputs.ca_cert_sha256 != '' }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache: false

      - name: Validate CA checksum input
        shell: pwsh
        run: |
          if ('${{ inputs.ca_cert_sha256 }}' -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'ca_cert_sha256 must be a SHA-256 digest.'
          }

      - name: Download and verify upstream payloads
        shell: pwsh
        run: .\tools\prepare-upstream-binaries.ps1 -CaCertSha256 '${{ inputs.ca_cert_sha256 }}'

      - name: Build Android ARM64 manager
        shell: pwsh
        run: .\tools\build-manager.ps1

      - name: Build flashable ZIP
        id: package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_TYPE: ${{ inputs.package_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ($env:PACKAGE_VERSION -notmatch '^\d+(?:\.\d+){1,3}(?:[-+][0-9A-Za-z.-]+)?$') {
            throw 'version must be a semantic version, for example 1.0.0.'
          }
          $fileName = "XSN_v$($env:PACKAGE_VERSION)_$($env:PACKAGE_TYPE)_sha256_$($env:COMMIT_SHA).zip"
          .\tools\package-module.ps1 -OutputDirectory artifacts\release -OutputFileName $fileName -ModuleVersion $env:PACKAGE_VERSION
          $zipPath = Join-Path (Resolve-Path artifacts\release) $fileName
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Expected package was not created: $zipPath"
          }
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: XSN_v${{ inputs.version }}_${{ inputs.package_type }}_sha256_${{ github.sha }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: ${{ inputs.package_type == 'release' }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download flashable module
        uses: actions/download-artifact@v4
        with:
          name: XSN_v${{ inputs.version }}_${{ inputs.package_type }}_sha256_${{ github.sha }}
          path: artifacts/release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_TITLE: XSN v${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/release/*.zip --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --generate-notes
          fi
